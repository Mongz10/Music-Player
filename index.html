<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mongz Music Player - Digital Wave</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="container">
      <div class="music-player">
        <nav>
            <div class="circle">
              <span class="material-icons">music</span>
            </div>
            <div id="authIndicator" class="auth-indicator" aria-live="polite"></div>
            <div class="circle">
                <span class="material-icons">menu</span>
            </div>
        </nav>
        <img src="media/aka.jpg" class="song-img">
        <h1>Lemons(Lemonade)</h1>
        <p>AKA ft Nasty C</p>
        <audio id="song">
           <source src="media/AKA-Nasty-C-Lemons.mp3" type="audio/mpeg">
        </audio>
        <input type="range" value="0" id="progress">
        <div class="controls">
           <div onclick="prevTrack()"><span class="material-icons">skip_previous</span></div>
           <div onclick="playPause()"><span class="material-icons" id="ctrlIcon">play_arrow</span></div>
           <div onclick="nextTrack()"><span class="material-icons">skip_next</span></div>
        </div>      
      </div>
  </div>

  <script>
   let progress = document.getElementById("progress");
   let song = document.getElementById("song");
   let ctrlIcon = document.getElementById("ctrlIcon");
   let authIndicator = document.getElementById("authIndicator");

   const playlist = [
     { title: "Lemons", artist: "AKA ft Nasty C", src: "media/AKA-Nasty-C-Lemons.mp3", img: "media/aka.jpg" },
     { title: "Ulele", artist: "Oscar_Mbo", src: "media/Oscar_Mbo-Ulele.mp3", img: "media/oscar.jpeg" },
     { title: "Hlasela", artist: "sjava-hlasela", src: "media/sjava-hlasela.mp3", img: "media/sjava 1.jpeg" },
     { title: "Time", artist: "sjava-time", src: "media/sjava-time.mp3", img: "media/sjava 2.jpeg" }
   ];

   let currentTrackIndex = 0;

   function safeParse(value) {
     if (!value || typeof value !== "string") return null;
     try {
       return JSON.parse(value);
     } catch {
       return null;
     }
   }

   function getFirstStringField(source, keys) {
     for (const key of keys) {
       if (typeof source[key] === "string") {
         const value = source[key].trim();
         if (value) return value;
       }
     }
     return "";
   }

   function extractUser(candidate) {
     if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)) return null;
     const name = getFirstStringField(candidate, ["displayName", "name", "fullName"]);
     const email = getFirstStringField(candidate, ["email", "mail"]);
     const photo = getFirstStringField(candidate, ["photoURL", "photoUrl", "picture", "avatar"]);
     if (!name && !email) return null;
     return { name, email, photo };
   }

   function isSafeAvatarUrl(url) {
     if (!url) return false;
     try {
       const parsed = new URL(url, window.location.origin);
       return parsed.protocol === "https:";
     } catch {
       return false;
     }
   }

   function getStoredUser() {
     const directKeys = ["loggedInUser", "authUser", "currentUser", "googleUser", "user"];
     for (const key of directKeys) {
       const parsed = safeParse(localStorage.getItem(key)) || safeParse(sessionStorage.getItem(key));
       const user = extractUser(parsed);
       if (user) return user;
     }

     for (const key of Object.keys(localStorage)) {
       if (key.startsWith("firebase:authUser:")) {
         const user = extractUser(safeParse(localStorage.getItem(key)));
         if (user) return user;
       }
     }

     return null;
   }

   function renderAuthIndicator() {
     if (!authIndicator) return;
     const user = getStoredUser();
     authIndicator.replaceChildren();
     if (!user) {
       authIndicator.setAttribute("aria-label", "Authentication status: guest user");
       const icon = document.createElement("span");
       icon.className = "material-icons";
       icon.textContent = "account_circle";
       const label = document.createElement("span");
       label.textContent = "Guest";
       authIndicator.append(icon, label);
       return;
     }

     const primaryText = user.name || user.email;
     const secondary = user.name && user.email ? user.email : "";
     authIndicator.setAttribute("aria-label", `Authentication status: signed in as ${primaryText}`);

     if (isSafeAvatarUrl(user.photo)) {
       const avatar = document.createElement("img");
       avatar.src = user.photo;
       avatar.alt = `Profile picture of ${user.name || "user"}`;
       avatar.className = "auth-avatar";
       authIndicator.appendChild(avatar);
     } else {
       const icon = document.createElement("span");
       icon.className = "material-icons";
       icon.textContent = "account_circle";
       authIndicator.appendChild(icon);
     }

     const text = document.createElement("span");
     text.className = "auth-text";
     const strong = document.createElement("strong");
     strong.textContent = primaryText;
     text.appendChild(strong);

     if (secondary) {
       const secondaryText = document.createElement("small");
       secondaryText.textContent = secondary;
       text.appendChild(secondaryText);
     }

     authIndicator.appendChild(text);
   }

   function loadTrack(index) {
     const track = playlist[index];
     song.src = track.src;
     document.querySelector('.song-img').src = track.img;
     document.querySelector('.music-player h1').textContent = track.title;
     document.querySelector('.music-player p').textContent = track.artist;
     song.play();
     ctrlIcon.textContent = "pause";
   }

   function playPause() {
     if (song.paused) {
       song.play();
       ctrlIcon.textContent = "pause";
     } else {
       song.pause();
       ctrlIcon.textContent = "play_arrow";
     }
   }

   function nextTrack() {
     currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
     loadTrack(currentTrackIndex);
   }

   function prevTrack() {
     currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
     loadTrack(currentTrackIndex);
   }

   song.addEventListener('ended', nextTrack);

   song.onloadedmetadata = function(){
     progress.max = song.duration;
     progress.value = song.currentTime;
   }

   setInterval(() => {
     progress.value = song.currentTime;
   }, 500);

   progress.onchange = function(){
     song.currentTime = progress.value;
     if (song.paused) {
       song.play();
       ctrlIcon.textContent = "pause";
     }
   }

   window.onload = function() {
     renderAuthIndicator();
     loadTrack(currentTrackIndex);
   };
  </script>
</body>
</html>
